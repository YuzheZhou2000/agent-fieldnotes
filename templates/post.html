<!-- Generated by scripts/build.mjs; edit content/ and templates/. -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="{{description}}">
<title>{{title}} · Agent Fieldnotes</title>
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/site.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>
<div class="reading-line" aria-hidden="true"></div>
<div class="wrap">
<nav class="topbar" aria-label="主导航">
<a class="brand" href="../index.html"><span class="brand-mark">a.</span> Agent Fieldnotes</a>
<div class="nav-actions"><a class="nav-primary" href="../learn.html">学习地图</a><a class="nav-primary" href="../tools/loop-lab.html">执行实验室</a><a href="../index.html#directions">技术方向</a><a href="../index.html#library">研究笔记</a><a href="../index.html#path">设计路线</a><button class="theme-button" type="button" aria-label="切换浅色与深色主题">主题 ◐</button></div>
</nav>

<main id="main" class="article-page" data-slug="{{slug}}">
<header class="article-header">
<a class="back-link" href="../index.html#library">← 返回文章目录</a>
<div class="eyebrow">FIELDNOTE {{number}} / {{topic}}</div>
<h1>{{titleLines}}</h1>
<p class="lede">{{summary}}</p>
<div class="article-meta"><time datetime="{{updated}}">{{updated}}</time><span>约 {{minutes}} 分钟</span><a href="../content/{{file}}" download>Markdown 源文 ↗</a></div>
<div class="tag-row">{{tags}}</div>
</header>
<div class="article-layout">
<aside class="toc-rail"><span class="rail-label">本篇导航</span><div class="toc">{{toc}}</div>
<button class="complete-button" type="button" data-slug="{{slug}}" aria-pressed="false">标记已学习</button><button class="print-button" type="button">打印 / 保存 PDF</button></aside>
<article class="prose">{{body}}</article>
</div>
<a class="next-article" href="{{nextSlug}}.html"><small>继续阅读 →</small><strong>{{nextTitle}}</strong></a>
</main>
<footer class="site-footer"><span>Agent Fieldnotes · 面向可验证的 Agent 系统</span><span>资料核查 {{updated}} · 正文与来源随 Git 维护</span></footer>
</div>
</body>
</html>
